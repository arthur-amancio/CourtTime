spring.application.name=CourtTime
# A configuracao local pode ser mantida fora do Git na raiz do projeto.
spring.config.import=optional:file:./application-local.properties
spring.datasource.url=${COURTTIME_DB_URL:jdbc:postgresql://localhost:5432/courttime}
spring.datasource.username=${COURTTIME_DB_USERNAME:postgres}
spring.datasource.password=${COURTTIME_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
courttime.documentos.diretorio=${COURTTIME_DOCUMENT_STORAGE_PATH:./data/documentos}
