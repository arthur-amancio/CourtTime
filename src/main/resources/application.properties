spring.application.name=CourtTime
# Configuracao local de demonstracao em um unico arquivo (decisao do grupo:
# banco PostgreSQL local, sem API ou chave externa).
# As variaveis de ambiente COURTTIME_DB_* continuam substituindo estes valores, como faz a CI.
spring.datasource.url=${COURTTIME_DB_URL:jdbc:postgresql://localhost:5432/courttime_demo}
spring.datasource.username=${COURTTIME_DB_USERNAME:postgres}
spring.datasource.password=${COURTTIME_DB_PASSWORD:postdba}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
courttime.documentos.diretorio=${COURTTIME_DOCUMENT_STORAGE_PATH:./data/documentos}
