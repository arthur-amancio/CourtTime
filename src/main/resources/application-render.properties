# Demonstração HTTPS: schema aplicado previamente em banco exclusivo e vazio.
server.address=0.0.0.0
server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.tracking-modes=cookie
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
server.tomcat.threads.max=16
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.data-source-properties.sslfactory=org.postgresql.ssl.DefaultJavaSSLFactory
spring.jpa.hibernate.ddl-auto=validate
courttime.documentos.storage=s3
courttime.https-obrigatorio=true
