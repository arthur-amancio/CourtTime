<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CourtTime | Início</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
        <div class="container site-header__inner site-header__inner--authenticated">
            <a class="brand" th:href="@{/inicio}">CourtTime</a>
            <div class="site-header__actions">
                <p class="session-user">
                    <span th:text="${nome}">Usuário</span>
                    <span>Perfil: <strong th:text="${perfil}">ALUNO</strong></span>
                </p>
                <form class="logout-form" th:action="@{/logout}" method="post">
                    <button class="button button--secondary button--small" type="submit">Sair</button>
                </form>
            </div>
        </div>
    </header>

    <main id="conteudo" class="container app-main">
        <header class="page-heading">
            <h1 id="page-title">Início</h1>
            <p>Olá, <span th:text="${nome}">Usuário</span>.</p>
        </header>

        <section class="quick-access" aria-labelledby="quick-access-title">
            <h2 id="quick-access-title">Acesso rápido</h2>
            <div class="quick-access__item">
                <div>
                    <h3>Quadra e horários</h3>
                    <p>Consulte a disponibilidade da quadra.</p>
                </div>
                <a class="button" th:href="@{/quadra}">Acessar</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p class="site-footer__brand">CourtTime</p>
            <p>ETEC Prof. Armando José Farinazzo</p>
        </div>
    </footer>
</body>
</html>
