<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CourtTime | Início</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>
        <div class="container site-header__inner">
            <a class="brand" th:href="@{/}">CourtTime</a>
            <span class="site-header__note">Área autenticada</span>
        </div>
    </header>

    <main id="conteudo" class="container main-content auth-main">
        <section class="auth-card" aria-labelledby="page-title">
            <p class="eyebrow">CourtTime</p>
            <h1 id="page-title">Olá, <span th:text="${nome}">Usuário</span></h1>
            <p class="account-info">Perfil: <strong th:text="${perfil}">ALUNO</strong></p>

            <a class="button account-action" th:href="@{/quadra}">Consultar quadra</a>

            <form class="logout-form" th:action="@{/logout}" method="post">
                <button class="button" type="submit">Sair</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <div class="container site-footer__inner">
            <p>CourtTime · TCC 2026</p>
            <p>ETEC Professor Armando José Farinazzo</p>
        </div>
    </footer>
</body>
</html>
