<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1080" viewBox="0 0 800 1080"><rect width="800" height="1080" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#14283c} .line{fill:none;stroke:#40566b;stroke-width:1.5}</style><text x="35" y="36" font-size="24" font-weight="bold">DER — documentos, contribuições e portaria</text><text x="35" y="62" font-size="14">CourtTime · árvore funcional 4fb7a06 · atributos e relações selecionados</text><rect x="35" y="90" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="35" y="90" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="45" y="114" font-size="17" font-weight="bold">reservas (referência)</text><text x="45" y="150" font-size="16">PK id: bigint</text><text x="45" y="170" font-size="16">NN rascunho: boolean DEFAULT false</text><rect x="430" y="90" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="430" y="90" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="440" y="114" font-size="17" font-weight="bold">documentos_reserva</text><text x="440" y="150" font-size="16">PK id: bigint</text><text x="440" y="170" font-size="16">FK NN reserva_id → reservas.id</text><text x="440" y="190" font-size="16">UQ (reserva_id, versao)</text><text x="440" y="210" font-size="16">UQ NN chave_armazenamento</text><text x="440" y="230" font-size="16">NN revisao_participantes: integer</text><text x="440" y="250" font-size="16">NN sha256: varchar(64)</text><text x="440" y="270" font-size="16">NN tamanho_bytes: bigint</text><text x="440" y="290" font-size="16">FK NN enviado_por_id → usuarios.id</text><rect x="35" y="395" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="35" y="395" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="45" y="419" font-size="17" font-weight="bold">contribuicoes_apm</text><text x="45" y="455" font-size="16">PK id: bigint</text><text x="45" y="475" font-size="16">UQ FK NN reserva_id → reservas.id</text><text x="45" y="495" font-size="16">UQ FK NN conferencia_documento_id</text><text x="45" y="515" font-size="16">NN valor: numeric(12,2)</text><text x="45" y="535" font-size="16">valor_devido / credito_aplicado: numeric</text><text x="45" y="555" font-size="16">FK contribuicao_origem_id → própria tabela</text><text x="45" y="575" font-size="16">FK NN registrada_por_id → usuarios.id</text><rect x="430" y="395" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="430" y="395" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="440" y="419" font-size="17" font-weight="bold">conferencias_documento</text><text x="440" y="455" font-size="16">PK id: bigint</text><text x="440" y="475" font-size="16">UQ FK NN documento_id</text><text x="440" y="495" font-size="16">NN resultado: varchar(30)</text><text x="440" y="515" font-size="16">justificativa: varchar(500)</text><text x="440" y="535" font-size="16">assinatura_gov_br_conferida: boolean</text><text x="440" y="555" font-size="16">FK NN conferido_por_id → usuarios.id</text><rect x="35" y="700" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="35" y="700" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="45" y="724" font-size="17" font-weight="bold">pagamentos_adicionais</text><text x="45" y="760" font-size="16">PK id: bigint</text><text x="45" y="780" font-size="16">FK NN reserva_id → reservas.id</text><text x="45" y="800" font-size="16">NN quantidade_pessoas: integer</text><text x="45" y="820" font-size="16">NN valor: numeric(12,2)</text><text x="45" y="840" font-size="16">NN local: varchar(12)</text><text x="45" y="860" font-size="16">FK NN registrado_por_id → usuarios.id</text><text x="45" y="880" font-size="16">FK repasse_confirmado_por_id → usuarios.id</text><text x="45" y="900" font-size="16">repasse_confirmado_em: Instant (JPA)</text><rect x="430" y="700" width="340" height="245" fill="white" stroke="#17365d" stroke-width="2"/><rect x="430" y="700" width="340" height="36" fill="#e4edf4" stroke="#17365d"/><text x="440" y="724" font-size="17" font-weight="bold">ajustes_contribuicao_apm</text><text x="440" y="760" font-size="16">PK id: bigint</text><text x="440" y="780" font-size="16">FK NN contribuicao_id</text><text x="440" y="800" font-size="16">NN valor_anterior / valor_novo: numeric</text><text x="440" y="820" font-size="16">NN motivo: varchar(500)</text><text x="440" y="840" font-size="16">FK NN ajustada_por_id → usuarios.id</text><polyline class="line" points="375,215 430,215"/><text x="378" y="230" font-size="13">1</text><text x="405" y="210" font-size="13">0..*</text><polyline class="line" points="600,335 600,395"/><text x="603" y="350" font-size="13">1</text><text x="603" y="390" font-size="13">0..1</text><polyline class="line" points="430,520 375,520"/><text x="414" y="535" font-size="13">1</text><text x="378" y="515" font-size="13">0..1</text><polyline class="line" points="205,335 205,395"/><text x="208" y="350" font-size="13">1</text><text x="208" y="390" font-size="13">0..1</text><polyline class="line" points="35,280 14,280 14,890 35,890"/><text x="19" y="295" font-size="13">1</text><text x="10" y="885" font-size="13">0..*</text><polyline class="line" points="375,613 405,613 405,918 430,918"/><text x="378" y="628" font-size="13">1</text><text x="405" y="913" font-size="13">0..*</text><text x="35" y="1045" font-size="13">Vista parcial. Campos opcionais preservam legado; recebimento na portaria não confirma repasse.</text><text x="35" y="1066" font-size="13">Fonte: Elaborado pelos autores (2026). Fonte editável: SVG e gerador versionado.</text></svg>