<title id="title">Atividades — cancelamento institucional e remarcação</title>
<desc id="desc">Nova solicitação conserva o vínculo e o crédito, mas repete documentação e aprovação</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#475467"/></marker><marker id="open-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10" fill="white" stroke="#475467" stroke-width="1.5"/></marker></defs>
<rect width="1123" height="794" fill="white"/>
<text x="28" y="30" text-anchor="start" font-size="21" font-weight="700" fill="#17365D"><tspan x="28" dy="0">Atividades — cancelamento institucional e remarcação</tspan></text>
<text x="28" y="50" text-anchor="start" font-size="10.5" font-weight="400" fill="#667085"><tspan x="28" dy="0">Nova solicitação conserva o vínculo e o crédito, mas repete documentação e aprovação</tspan></text>
<line x1="28" y1="59" x2="1095" y2="59" stroke="#17365D" stroke-width="1.5"/>
<rect x="20" y="90" width="1080" height="150" fill="#FFFFFF" stroke="#475467" stroke-width="1"/><rect x="20" y="90" width="96" height="150" fill="#FDE8E7" stroke="#475467" stroke-width="1"/><text x="68" y="158" text-anchor="middle" font-size="12" font-weight="700" fill="#172033"><tspan x="68" dy="0">Administração</tspan></text><rect x="20" y="240" width="1080" height="175" fill="#FFFFFF" stroke="#475467" stroke-width="1"/><rect x="20" y="240" width="96" height="175" fill="#DDF3F5" stroke="#475467" stroke-width="1"/><text x="68" y="320.5" text-anchor="middle" font-size="12" font-weight="700" fill="#172033"><tspan x="68" dy="0">CourtTime</tspan></text><rect x="20" y="415" width="1080" height="135" fill="#FFFFFF" stroke="#475467" stroke-width="1"/><rect x="20" y="415" width="96" height="135" fill="#DCEAF7" stroke="#475467" stroke-width="1"/><text x="68" y="475.5" text-anchor="middle" font-size="12" font-weight="700" fill="#172033"><tspan x="68" dy="0">Aluno</tspan></text><rect x="20" y="550" width="1080" height="160" fill="#FFFFFF" stroke="#475467" stroke-width="1"/><rect x="20" y="550" width="96" height="160" fill="#FEF3C7" stroke="#475467" stroke-width="1"/><text x="68" y="623" text-anchor="middle" font-size="12" font-weight="700" fill="#172033"><tspan x="68" dy="0">Secretaria</tspan></text>
<polyline points="133,154 160,154" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="232,183 232,285" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="320,314 370,314" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="447,285 447,183" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="510,154 550,154 550,479 575,479" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="647,450 647,314 735,314" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="802,343 802,445" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="860,482 880,482 880,314 900,314" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="849" y="394" width="62" height="16" rx="2" fill="white" opacity="0.92"/><text x="880" y="406" text-anchor="middle" font-size="10" font-weight="600" fill="#667085"><tspan x="880" dy="0">sim ou não</tspan></text><polyline points="985,343 985,450" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="985,508 985,535 662,535 662,595" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="750,625 800,625" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/><polyline points="960,625 1010,625" fill="none" stroke="#475467" stroke-width="1.5" marker-end="url(#arrow)"/>
<circle cx="124" cy="154" r="9" fill="#172033"/><rect x="160" y="125" width="145" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="232.5" y="147" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="232.5" dy="0">Cancelar reserva</tspan><tspan x="232.5" dy="14">aprovada com motivo</tspan></text><rect x="355" y="125" width="155" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="432.5" y="140" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="432.5" dy="0">Avisar o aluno</tspan><tspan x="432.5" dy="14">manualmente pelo</tspan><tspan x="432.5" dy="14">WhatsApp</tspan></text><rect x="160" y="285" width="160" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="240" y="307" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="240" dy="0">Registrar CANCELADA e</tspan><tspan x="240" dy="14">preservar histórico</tspan></text><rect x="370" y="285" width="155" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="447.5" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="447.5" dy="0">Disponibilizar valor</tspan><tspan x="447.5" dy="14">efetivamente pago como</tspan><tspan x="447.5" dy="14">crédito</tspan></text><rect x="575" y="450" width="145" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="647.5" y="472" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="647.5" dy="0">Solicitar remarcação e</tspan><tspan x="647.5" dy="14">escolher novo período</tspan></text><rect x="735" y="285" width="135" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="802.5" y="300" text-anchor="middle" font-size="10.8" font-weight="600" fill="#172033"><tspan x="802.5" dy="0">Travar origem e</tspan><tspan x="802.5" dy="14">validar sucessora</tspan><tspan x="802.5" dy="14">única</tspan></text><polygon points="805,445 860,482.5 805,520 750,482.5" fill="#FEF3C7" stroke="#A16207" stroke-width="1.6"/><text x="805" y="476.5" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033"><tspan x="805" dy="0">Copiar</tspan><tspan x="805" dy="12">participantes?</tspan></text><rect x="900" y="285" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="985" y="300" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="985" dy="0">Criar nova</tspan><tspan x="985" dy="14">PENDENTE_DOCUMENTACAO</tspan><tspan x="985" dy="14">vinculada à origem</tspan></text><rect x="900" y="450" width="170" height="58" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="985" y="472" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="985" dy="0">Refazer documento e</tspan><tspan x="985" dy="14">aprovação</tspan></text><rect x="575" y="595" width="175" height="60" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="662.5" y="611" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="662.5" dy="0">Calcular devido,</tspan><tspan x="662.5" dy="14">crédito, diferença e</tspan><tspan x="662.5" dy="14">excedente</tspan></text><rect x="800" y="595" width="160" height="60" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="880" y="618" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="880" dy="0">Registrar uso do crédito</tspan><tspan x="880" dy="14">e eventual diferença</tspan></text><circle cx="1022" cy="625" r="12" fill="white" stroke="#172033" stroke-width="2"/><circle cx="1022" cy="625" r="7" fill="#172033"/><path d="M 120 585 H 476 L 490 599 V 670 H 120 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/><path d="M 476 585 V 599 H 490" fill="none" stroke="#A16207" stroke-width="1.2"/><text x="128" y="603" text-anchor="start" font-size="10.5" font-weight="400" fill="#172033"><tspan x="128" dy="0">Não há devolução automática. O saldo excedente apenas é exibido,</tspan><tspan x="128" dy="13">pois seu destino institucional permanece sem decisão.</tspan></text>
