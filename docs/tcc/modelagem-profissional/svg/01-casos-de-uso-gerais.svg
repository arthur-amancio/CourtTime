chor="middle" font-size="13" font-weight="700" fill="#172033"><tspan x="1020" dy="0">Segurança</tspan></text><ellipse cx="380" cy="140" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="380" y="132" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="380" dy="0">Consultar calendário e</tspan><tspan x="380" dy="16">disponibilidade</tspan></text><ellipse cx="380" cy="235" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="380" y="227" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="380" dy="0">Criar e acompanhar</tspan><tspan x="380" dy="16">solicitação</tspan></text><ellipse cx="380" cy="330" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="380" y="322" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="380" dy="0">Manter participantes e</tspan><tspan x="380" dy="16">documentação</tspan></text><ellipse cx="380" cy="485" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="380" y="477" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="380" dy="0">Conferir documento e</tspan><tspan x="380" dy="16">assinatura gov.br</tspan></text><ellipse cx="380" cy="590" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="380" y="582" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="380" dy="0">Registrar contribuição</tspan><tspan x="380" dy="16">presencial</tspan></text><ellipse cx="740" cy="175" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="740" y="175" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="740" dy="0">Analisar solicitação</tspan></text><ellipse cx="740" cy="280" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="740" y="272" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="740" dy="0">Administrar agenda e</tspan><tspan x="740" dy="16">usuários</tspan></text><ellipse cx="740" cy="385" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="740" y="377" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="740" dy="0">Cancelar reserva</tspan><tspan x="740" dy="16">institucionalmente</tspan></text><ellipse cx="740" cy="515" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="740" y="507" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="740" dy="0">Controlar presença e</tspan><tspan x="740" dy="16">liberar quadra</tspan></text><ellipse cx="740" cy="620" rx="110" ry="30" fill="#FFFFFF" stroke="#17365D" stroke-width="1.8"/><text x="740" y="612" text-anchor="middle" font-size="13" font-weight="600" fill="#172033"><tspan x="740" dy="0">Confirmar repasse da</tspan><tspan x="740" dy="16">portaria</tspan></text>
