Portaria(...): void</tspan></text><rect x="360" y="500" width="260" height="155" rx="3" fill="white" stroke="#17365D" stroke-width="1.6"/><rect x="360" y="500" width="260" height="38" rx="3" fill="#DCEAF7" stroke="none"/><text x="490" y="513" text-anchor="middle" font-size="10" font-weight="400" fill="#667085"><tspan x="490" dy="0">«entity»</tspan></text><text x="490" y="529" text-anchor="middle" font-size="13" font-weight="700" fill="#17365D"><tspan x="490" dy="0">DisponibilidadeQuadra</tspan></text><line x1="360" y1="538" x2="620" y2="538" stroke="#17365D" stroke-width="1"/><text x="367" y="552" text-anchor="start" font-size="10.5" font-weight="400" fill="#172033"><tspan x="367" dy="0">- id: Long</tspan><tspan x="367" dy="13.5">- diaSemana: DiaSemana</tspan><tspan x="367" dy="13.5">- horarioInicio: LocalTime</tspan><tspan x="367" dy="13.5">- horarioFim: LocalTime</tspan><tspan x="367" dy="13.5">- ativa: boolean</tspan><tspan x="367" dy="13.5">+ isIntervaloValido(): boolean</tspan></text><rect x="760" y="500" width="260" height="155" rx="3" fill="white" stroke="#17365D" stroke-width="1.6"/><rect x="760" y="500" width="260" height="38" rx="3" fill="#DCEAF7" stroke="none"/><text x="890" y="513" text-anchor="middle" font-size="10" font-weight="400" fill="#667085"><tspan x="890" dy="0">«entity»</tspan></text><text x="890" y="529" text-anchor="middle" font-size="13" font-weight="700" fill="#17365D"><tspan x="890" dy="0">BloqueioQuadra</tspan></text><line x1="760" y1="538" x2="1020" y2="538" stroke="#17365D" stroke-width="1"/><text x="767" y="552" text-anchor="start" font-size="10.5" font-weight="400" fill="#172033"><tspan x="767" dy="0">- id: Long</tspan><tspan x="767" dy="13.5">- data: LocalDate</tspan><tspan x="767" dy="13.5">- horarioInicio: LocalTime</tspan><tspan x="767" dy="13.5">- horarioFim: LocalTime</tspan><tspan x="767" dy="13.5">- motivo: String</tspan><tspan x="767" dy="13.5">- ativo: boolean</tspan><tspan x="767" dy="13.5">+ isIntervaloValido(): boolean</tspan></text><path d="M 35 565 H 276 L 290 579 V 685 H 35 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/><path d="M 276 565 V 579 H 290" fill="none" stroke="#A16207" stroke-width="1.2"/><text x="43" y="583" text-anchor="start" font-size="11" font-weight="400" fill="#172033"><tspan x="43" dy="0">Associações são simples:</tspan><tspan x="43" dy="13">o código não declara cascade</tspan><tspan x="43" dy="13">nem orphanRemoval. Por isso</tspan><tspan x="43" dy="13">não se usa composição UML.</tspan></text>
