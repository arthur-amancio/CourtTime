<circle cx="121" cy="139" r="9" fill="#172033"/><rect x="155" y="112" width="125" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="217.5" y="132.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="217.5" dy="0">Selecionar período e</tspan><tspan x="217.5" dy="14">salvar rascunho</tspan></text><rect x="315" y="245" width="135" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="382.5" y="265.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="382.5" dy="0">Validar antecedência,</tspan><tspan x="382.5" dy="14">grade e disponibilidade</tspan></text><rect x="480" y="112" width="140" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="550" y="132.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="550" dy="0">Cadastrar 10 pessoas e</tspan><tspan x="550" dy="14">formalizar pedido</tspan></text><rect x="650" y="112" width="130" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="715" y="132.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="715" dy="0">Gerar, assinar no gov.br</tspan><tspan x="715" dy="14">e enviar PDF</tspan></text><rect x="815" y="245" width="125" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="877.5" y="265.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="877.5" dy="0">Versionar PDF e travar</tspan><tspan x="877.5" dy="14">lista</tspan></text><rect x="155" y="372" width="135" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="222.5" y="392.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="222.5" dy="0">Conferir PDF e</tspan><tspan x="222.5" dy="14">assinatura no ITI</tspan></text><polygon points="377.5,365 425,400 377.5,435 330,400" fill="#FEF3C7" stroke="#A16207" stroke-width="1.6"/><text x="377.5" y="394" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033"><tspan x="377.5" dy="0">Documento</tspan><tspan x="377.5" dy="12">correto?</tspan></text><rect x="470" y="372" width="150" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="545" y="392.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="545" dy="0">Registrar R$ 2,00 ×</tspan><tspan x="545" dy="14">participantes</tspan></text><rect x="665" y="245" width="120" height="55" rx="10" fill="#DDF3F5" stroke="#17365D" stroke-width="1.6"/><text x="725" y="265.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="725" dy="0">Mudar para</tspan><tspan x="725" dy="14">PENDENTE_ANALISE</tspan></text><rect x="680" y="490" width="135" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="747.5" y="510.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="747.5" dy="0">Revalidar elegibilidade</tspan><tspan x="747.5" dy="14">e conflito</tspan></text><polygon points="897.5,482 945,517 897.5,552 850,517" fill="#FEF3C7" stroke="#A16207" stroke-width="1.6"/><text x="897.5" y="517" text-anchor="middle" font-size="10.5" font-weight="700" fill="#172033"><tspan x="897.5" dy="0">Aprovar?</tspan></text><rect x="155" y="615" width="145" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="227.5" y="635.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="227.5" dy="0">Registrar presença e</tspan><tspan x="227.5" dy="14">pessoas adicionais</tspan></text><rect x="355" y="615" width="150" height="55" rx="10" fill="#FFFFFF" stroke="#17365D" stroke-width="1.6"/><text x="430" y="635.5" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="430" dy="0">Liberar com 10 presentes</tspan><tspan x="430" dy="14">e sem pendência</tspan></text><circle cx="572" cy="643" r="12" fill="white" stroke="#172033" stroke-width="2"/><circle cx="572" cy="643" r="7" fill="#172033"/><circle cx="1027" cy="517" r="12" fill="white" stroke="#172033" stroke-width="2"/><circle cx="1027" cy="517" r="7" fill="#172033"/><path d="M 650 600 H 1026 L 1040 614 V 685 H 650 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/><path d="M 1026 600 V 614 H 1040" fill="none" stroke="#A16207" stroke-width="1.2"/><text x="658" y="618" text-anchor="start" font-size="10.5" font-weight="400" fill="#172033"><tspan x="658" dy="0">Após a liberação, participantes e presenças ficam imutáveis.</tspan><tspan x="658" dy="13">A assinatura e o uso do ITI são ações humanas externas.</tspan></text>
