 stroke="#17365D" stroke-width="1.6"/><text x="775" y="622" text-anchor="middle" font-size="11.5" font-weight="600" fill="#172033"><tspan x="775" dy="0">Confirmar repasse</tspan><tspan x="775" dy="14">recebido da portaria</tspan></text><path d="M 885 585 H 1056 L 1070 599 V 675 H 885 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/><path d="M 1056 585 V 599 H 1070" fill="none" stroke="#A16207" stroke-width="1.2"/><text x="893" y="603" text-anchor="start" font-size="9.7" font-weight="400" fill="#172033"><tspan x="893" dy="0">Vaga paga permanece no histórico.</tspan><tspan x="893" dy="13">Se alguém sair, outra pessoa pode</tspan><tspan x="893" dy="13">ocupá-la sem cobrança duplicada.</tspan></text>
