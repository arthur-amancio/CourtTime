="middle" font-size="10" font-weight="400" fill="#667085"><tspan x="987.5" dy="0">«entity»</tspan></text><text x="987.5" y="114" text-anchor="middle" font-size="13" font-weight="700" fill="#17365D"><tspan x="987.5" dy="0">ContribuicaoApm</tspan></text><line x1="875" y1="123" x2="1100" y2="123" stroke="#17365D" stroke-width="1"/><text x="882" y="137" text-anchor="start" font-size="9.8" font-weight="400" fill="#172033"><tspan x="882" dy="0">- valor: BigDecimal</tspan><tspan x="882" dy="13.5">- valorDevido: BigDecimal [0..1]</tspan><tspan x="882" dy="13.5">- creditoAplicado: BigDecimal [0..1]</tspan><tspan x="882" dy="13.5">- observacoes: String [0..1]</tspan><tspan x="882" dy="13.5">- registradaEm: Instant</tspan><tspan x="882" dy="13.5">+ getValorEfetivamentePago(): BigDecimal</tspan></text><rect x="300" y="425" width="235" height="185" rx="3" fill="white" stroke="#17365D" stroke-width="1.6"/><rect x="300" y="425" width="235" height="38" rx="3" fill="#DCEAF7" stroke="none"/><text x="417.5" y="438" text-anchor="middle" font-size="10" font-weight="400" fill="#667085"><tspan x="417.5" dy="0">«entity»</tspan></text><text x="417.5" y="454" text-anchor="middle" font-size="13" font-weight="700" fill="#17365D"><tspan x="417.5" dy="0">PagamentoAdicional</tspan></text><line x1="300" y1="463" x2="535" y2="463" stroke="#17365D" stroke-width="1"/><text x="307" y="477" text-anchor="start" font-size="9.8" font-weight="400" fill="#172033"><tspan x="307" dy="0">- quantidadePessoas: int</tspan><tspan x="307" dy="13.5">- valor: BigDecimal</tspan><tspan x="307" dy="13.5">- local: LocalPagamento</tspan><tspan x="307" dy="13.5">- registradoEm: Instant</tspan><tspan x="307" dy="13.5">- repasseConfirmadoEm: Instant [0..1]</tspan><tspan x="307" dy="13.5">+ aguardaRepasse(): boolean</tspan></text><rect x="875" y="440" width="225" height="185" rx="3" fill="white" stroke="#17365D" stroke-width="1.6"/><rect x="875" y="440" width="225" height="38" rx="3" fill="#DCEAF7" stroke="none"/><text x="987.5" y="453" text-anchor="middle" font-size="10" font-weight="400" fill="#667085"><tspan x="987.5" dy="0">«entity»</tspan></text><text x="987.5" y="469" text-anchor="middle" font-size="13" font-weight="700" fill="#17365D"><tspan x="987.5" dy="0">AjusteContribuicaoApm</tspan></text><line x1="875" y1="478" x2="1100" y2="478" stroke="#17365D" stroke-width="1"/><text x="882" y="492" text-anchor="start" font-size="9.5" font-weight="400" fill="#172033"><tspan x="882" dy="0">- valorAnterior: BigDecimal</tspan><tspan x="882" dy="13.5">- valorNovo: BigDecimal</tspan><tspan x="882" dy="13.5">- motivo: String</tspan><tspan x="882" dy="13.5">- observacoesAnteriores: String [0..1]</tspan><tspan x="882" dy="13.5">- observacoesNovas: String [0..1]</tspan><tspan x="882" dy="13.5">- ajustadaEm: Instant</tspan></text><path d="M 585 385 H 806 L 820 399 V 635 H 585 Z" fill="#FEF3C7" stroke="#A16207" stroke-width="1.2"/><path d="M 806 385 V 399 H 820" fill="none" stroke="#A16207" stroke-width="1.2"/><text x="593" y="403" text-anchor="start" font-size="10.3" font-weight="400" fill="#172033"><tspan x="593" dy="0">Os eventos preservam o operador:</tspan><tspan x="593" dy="13"></tspan><tspan x="593" dy="13">Documento: enviadoPor</tspan><tspan x="593" dy="13">Conferência: conferidoPor</tspan><tspan x="593" dy="13">Contribuição: registradaPor</tspan><tspan x="593" dy="13">Ajuste: ajustadaPor</tspan><tspan x="593" dy="13">Participante: presença/adicionadoPor</tspan><tspan x="593" dy="13">Pagamento: registradoPor e</tspan><tspan x="593" dy="13">repasseConfirmadoPor.</tspan><tspan x="593" dy="13"></tspan><tspan x="593" dy="13">Todos referenciam Usuario.</tspan></text>
