name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: verify (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest

    # A CI usa o PostgreSQL 16; o 18 e a versao recomendada para os
    # computadores da equipe e da escola. Os dois rodam a mesma suite.
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '18']

    services:
      postgres:
        image: postgres:${{ matrix.postgres }}-alpine
        env:
          POSTGRES_DB: courttime_test
          POSTGRES_USER: courttime
          POSTGRES_PASSWORD: courttime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courttime -d courttime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COURTTIME_POSTGRES_TEST: true
      COURTTIME_DB_URL: jdbc:postgresql://localhost:5432/courttime_test
      COURTTIME_DB_USERNAME: courttime
      COURTTIME_DB_PASSWORD: courttime_test
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validar sintaxe dos scripts PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/Verificar-Ambiente-CourtTime.ps1'),
            [ref] $tokens,
            [ref] $errors
          ) > $null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Testar leitura real do arquivo local no PowerShell
        shell: pwsh
        env:
          COURTTIME_DB_URL: ''
          COURTTIME_DB_PASSWORD: ''
          COURTTIME_POSTGRES_TEST: 'false'
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
        run: |
          $arquivo = 'application-local.properties'
          if (Test-Path -LiteralPath $arquivo) { throw 'Arquivo de configuracao inesperado no checkout.' }
          try {
            @(
              'spring.datasource.url=jdbc:postgresql://localhost:5432/courttime_demo'
              'spring.datasource.username=courttime'
              'spring.datasource.password=senha-ficticia-somente-na-ci'
            ) | Set-Content -LiteralPath $arquivo -Encoding utf8
            $saida = (& pwsh -NoProfile -File scripts/Verificar-Ambiente-CourtTime.ps1 2>&1 | Out-String)
            if ($saida -notmatch '\[ok\]\s+Senha PostgreSQL configurada') {
              throw 'O verificador nao leu a senha do arquivo local.'
            }
            if ($saida -notmatch '\[ok\]\s+Banco configurado e courttime_demo') {
              throw 'O verificador nao leu o banco courttime_demo do arquivo local.'
            }
            if ($saida.Contains('senha-ficticia-somente-na-ci')) {
              throw 'O verificador expôs o valor da senha.'
            }
            Write-Host 'Leitura real de URL e senha ficticia validada, sem exposicao da senha.'
          }
          finally {
            Remove-Item -LiteralPath $arquivo -Force -ErrorAction SilentlyContinue
          }

      - name: Rejeitar marcadores de conflito em folhas CSS
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          padrao = re.compile(r'^\s*(?:<{7}(?:\s|$)|>{7}(?:\s|$)|={7}\s*$)')
          assert padrao.match('=======') and padrao.match('<<<<<<< HEAD') and padrao.match('>>>>>>> feature')
          assert not padrao.match('================================================================== */')
          for path in Path('src/main/resources/static/css').glob('*.css'):
              for numero, linha in enumerate(path.read_text(encoding='utf-8').splitlines(), start=1):
                  if padrao.match(linha):
                      raise SystemExit(f'Marcador de conflito em {path}:{numero}: {linha}')
          PY

      - name: Compilar e executar os testes
        run: |
          set -o pipefail
          ./mvnw clean verify 2>&1 | tee "$RUNNER_TEMP/maven.log"

      # O log completo do job nem sempre pode ser baixado. Este passo mostra
      # os erros de compilacao e os testes que falharam como anotacoes.
      - name: Resumir falhas da suite
        if: failure()
        run: |
          grep -E '^\[ERROR\] .*\.java' "$RUNNER_TEMP/maven.log" | head -20 | sed 's/^/::error title=Compilacao::/' || true
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          for arquivo in glob.glob('target/surefire-reports/TEST-*.xml') + glob.glob('target/failsafe-reports/TEST-*.xml'):
              for caso in ET.parse(arquivo).getroot().iter('testcase'):
                  for tipo in ('failure', 'error'):
                      falha = caso.find(tipo)
                      if falha is not None:
                          mensagem = (falha.get('message') or falha.text or '').replace('\n', ' ')[:500]
                          classe = caso.get('classname', '').rsplit('.', 1)[-1]
                          print(f"::error title={classe}.{caso.get('name')}::{mensagem}")
          PY

      - name: Validar dados ficticios no PostgreSQL descartavel
        env:
          COURTTIME_DB_URL: jdbc:postgresql://localhost:5432/courttime_demo
          COURTTIME_DB_USERNAME: courttime
          COURTTIME_DB_PASSWORD: courttime_test
          COURTTIME_POSTGRES_TEST: 'false'
          SPRING_JPA_HIBERNATE_DDL_AUTO: update
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: courttime
          PGPASSWORD: courttime_test
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          # Isolado do courttime_test usado pela suite Maven.
          psql -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE courttime_demo;"
          java -jar target/courttime-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/demo-app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 90); do
            if curl --silent --fail http://localhost:8080/ >/dev/null; then
              ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then
            tail -100 "$RUNNER_TEMP/demo-app.log"
            exit 1
          fi
          kill "$app_pid"
          wait "$app_pid" 2>/dev/null || true
          trap - EXIT

          # Senha ficticia somente no runner descartavel, jamais no repositorio.
          python3 - <<'PY'
          from pathlib import Path
          sql = Path('scripts/popular-demo.sql').read_text()
          before = "SET LOCAL courttime.demo_password = 'TROQUE_A_SENHA_DEMO_AQUI';"
          assert sql.count(before) == 1, 'Placeholder de senha nao encontrado'
          Path('/tmp/courttime-seed-ci.sql').write_text(
              sql.replace(before, "SET LOCAL courttime.demo_password = 'senha-demo-ci-apenas';")
          )
          PY

          psql -d courttime_demo -v ON_ERROR_STOP=1 -f /tmp/courttime-seed-ci.sql
          totais=$(psql -d courttime_demo -At -c "
            SELECT
              (SELECT count(*) FROM usuarios WHERE email LIKE '%.demo@exemplo.invalid') || ':' ||
              (SELECT count(*) FROM disponibilidades_quadra) || ':' ||
              (SELECT count(*) FROM bloqueios_quadra WHERE motivo LIKE 'DEMO -%') || ':' ||
              (SELECT count(*) FROM reservas WHERE finalidade LIKE '[DEMO]%') || ':' ||
              (SELECT count(*) FROM participantes_reserva);
          ")
          echo "Totais apos seed: $totais"
          IFS=: read -r usuarios horarios bloqueios reservas participantes <<< "$totais"
          test "$usuarios" -eq 17
          test "$horarios" -eq 8
          test "$bloqueios" -eq 24
          test "$reservas" -ge 20
          test "$participantes" -eq 186
          # R09: seis participantes Outro, todos com vinculo.
          outros=$(psql -d courttime_demo -At -c "
            SELECT count(*) FROM participantes_reserva
            WHERE categoria = 'OUTRO' AND vinculo IS NOT NULL;")
          test "$outros" -eq 6

          # Reexecucao nao pode duplicar nem alterar registros.
          psql -d courttime_demo -v ON_ERROR_STOP=1 -f /tmp/courttime-seed-ci.sql >/dev/null
          depois=$(psql -d courttime_demo -At -c "
            SELECT
              (SELECT count(*) FROM usuarios WHERE email LIKE '%.demo@exemplo.invalid') || ':' ||
              (SELECT count(*) FROM disponibilidades_quadra) || ':' ||
              (SELECT count(*) FROM bloqueios_quadra WHERE motivo LIKE 'DEMO -%') || ':' ||
              (SELECT count(*) FROM reservas WHERE finalidade LIKE '[DEMO]%') || ':' ||
              (SELECT count(*) FROM participantes_reserva);
          ")
          test "$totais" = "$depois"

          # Nome incorreto: recusado antes de qualquer escrita.
          if psql -d courttime_test -v ON_ERROR_STOP=1 -f /tmp/courttime-seed-ci.sql >/dev/null 2>&1; then
            echo "ERRO: o seed nao bloqueou um banco diferente de courttime_demo"
            exit 1
          fi
          echo "Seed validado: isolado, repetivel e restrito a courttime_demo."
