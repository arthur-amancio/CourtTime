name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courttime_test
          POSTGRES_USER: courttime
          POSTGRES_PASSWORD: courttime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courttime -d courttime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COURTTIME_POSTGRES_TEST: true
      COURTTIME_DB_URL: jdbc:postgresql://localhost:5432/courttime_test
      COURTTIME_DB_USERNAME: courttime
      COURTTIME_DB_PASSWORD: courttime_test
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar os testes
        run: ./mvnw clean verify

      # Passo TEMPORARIO de diagnostico: publica as falhas como annotations,
      # porque o download dos logs nao esta disponivel para quem investiga.
      # Remover antes de integrar esta branch.
      - name: Mostrar falhas de teste
        if: failure()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "FAILURE|<<< ERROR" "$f"; then
              echo "::error title=$(basename "$f")::$(sed -n '4,40p' "$f" | tr '\n' ' ' | tr -s ' ' | cut -c1-1200)"
            fi
          done
