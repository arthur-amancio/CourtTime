name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courttime_test
          POSTGRES_USER: courttime
          POSTGRES_PASSWORD: courttime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courttime -d courttime_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COURTTIME_POSTGRES_TEST: true
      COURTTIME_DB_URL: jdbc:postgresql://localhost:5432/courttime_test
      COURTTIME_DB_USERNAME: courttime
      COURTTIME_DB_PASSWORD: courttime_test
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Compilar e executar os testes
        run: |
          set -o pipefail
          ./mvnw -B clean verify 2>&1 | tee build.log

      - name: Diagnostico temporario
        if: failure()
        run: |
          grep -E 'Tests run:.*Fail|<<< (FAILURE|ERROR)' build.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
          for f in target/surefire-reports/*.txt; do
            if grep -qE 'FAILURE|ERROR' "$f"; then
              grep -A6 -E 'AssertionFailedError|Exception:|expected' "$f" | head -30 | tr '\n' ' ' | cut -c1-3000 | sed 's/^/::error::/'
              echo
            fi
          done
