name: UI — navegador real (banco descartável)

# Executa a aplicacao Spring Boot real contra um PostgreSQL 16 temporario
# (courttime_e2e) criado so para este job e destruido ao final do runner.
# Nunca aponta para courttime_demo, courttime_test ou banco persistente.

on:
  push:
    branches:
      - 'feat/ui-v2-**'
      - 'chore/ui-v2-**'
      - 'test/qa-redesign-v2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-navegador-${{ github.ref }}
  cancel-in-progress: true

jobs:
  navegador:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: courttime_e2e
          POSTGRES_USER: courttime_e2e
          POSTGRES_PASSWORD: e2e_descartavel
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U courttime_e2e -d courttime_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      COURTTIME_E2E_ACK_ISOLATED_DB: 'YES'
      COURTTIME_E2E_DATABASE_NAME: courttime_e2e
      COURTTIME_E2E_BASE_URL: http://127.0.0.1:18081
      COURTTIME_E2E_EVIDENCE_DIR: ${{ github.workspace }}/evidencias-ui
      COURTTIME_E2E_TARGET_SHA: ${{ github.sha }}
      COURTTIME_E2E_INSTANCE_TOKEN: qa${{ github.run_id }}
      COURTTIME_E2E_ADMIN_EMAIL: admin.qa${{ github.run_id }}@e2e.invalid

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7

      - name: Configurar Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configurar Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: qa/playwright/package-lock.json

      - name: Gerar senha sintética desta execução
        run: |
          senha="E2e$(openssl rand -hex 12)"
          echo "::add-mask::$senha"
          echo "COURTTIME_E2E_PASSWORD=$senha" >> "$GITHUB_ENV"

      - name: Empacotar a aplicação (testes Java rodam no workflow CI)
        run: ./mvnw -B -q -DskipTests package

      - name: Iniciar a aplicação no banco descartável
        env:
          COURTTIME_DB_URL: jdbc:postgresql://localhost:5432/courttime_e2e
          COURTTIME_DB_USERNAME: courttime_e2e
          COURTTIME_DB_PASSWORD: e2e_descartavel
          COURTTIME_DOCUMENT_STORAGE_PATH: ${{ runner.temp }}/documentos-e2e
          SERVER_PORT: '18081'
          COURTTIME_BOOTSTRAP_ADMIN_ENABLED: 'true'
          COURTTIME_DEV_USER_NAME: Administrador E2E qa${{ github.run_id }}
          COURTTIME_DEV_USER_EMAIL: ${{ env.COURTTIME_E2E_ADMIN_EMAIL }}
          COURTTIME_DEV_USER_PROFILE: ADMINISTRADOR
        run: |
          COURTTIME_DEV_USER_PASSWORD="$COURTTIME_E2E_PASSWORD" \
            nohup java -jar target/courttime-0.0.1-SNAPSHOT.jar > "$RUNNER_TEMP/app.log" 2>&1 &
          for i in $(seq 1 90); do
            if curl --silent --fail http://127.0.0.1:18081/login >/dev/null; then exit 0; fi
            sleep 1
          done
          tail -100 "$RUNNER_TEMP/app.log"
          exit 1

      - name: Confirmar que a aplicação usa somente courttime_e2e
        env:
          PGPASSWORD: e2e_descartavel
        run: |
          total=$(psql -h localhost -U courttime_e2e -d courttime_e2e -At -c "SELECT count(*) FROM usuarios;")
          banco=$(psql -h localhost -U courttime_e2e -d courttime_e2e -At -c "SELECT current_database();")
          admin=$(psql -h localhost -U courttime_e2e -d courttime_e2e -At -c "SELECT count(*) FROM usuarios WHERE email = '$COURTTIME_E2E_ADMIN_EMAIL';")
          echo "banco=$banco usuarios=$total admin_bootstrap=$admin"
          test "$banco" = "courttime_e2e"
          test "$total" -eq 1
          test "$admin" -eq 1

      - name: Instalar dependências de QA e Chromium
        working-directory: qa/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Proteção do ambiente
        working-directory: qa/playwright
        run: npm run test:guard

      - name: Jornada dos quatro perfis
        working-directory: qa/playwright
        run: npm run test:jornada

      - name: Contratos de navegação e autorização
        working-directory: qa/playwright
        run: npm run test:navegacao

      - name: Interações e responsividade da V2
        if: always()
        working-directory: qa/playwright
        run: npm run test:redesign

      - name: Auditoria de acessibilidade (axe-core)
        if: always()
        working-directory: qa/playwright
        run: npm run test:a11y

      - name: Capturas e verificações de layout
        if: always()
        working-directory: qa/playwright
        run: npm run test:telas

      - name: Sondas da finalização (participantes, PDF, remarcação, acessos)
        if: always()
        working-directory: qa/playwright
        run: npm run test:finalizacao

      - name: Conferir os PDFs gerados e a ausência do CPF no banco
        if: always()
        env:
          PGPASSWORD: e2e_descartavel
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --disable-pip-version-check pypdf==5.1.0
          python3 - <<'PY'
          import os, sys
          from pypdf import PdfReader
          pasta = os.environ['COURTTIME_E2E_EVIDENCE_DIR']
          esperado = {'final-formulario-11.pdf': 2, 'final-formulario-31.pdf': 3}
          erros = []
          for nome, paginas in esperado.items():
              caminho = os.path.join(pasta, nome)
              if not os.path.exists(caminho):
                  erros.append(f'{nome} não foi gerado'); continue
              leitor = PdfReader(caminho)
              texto = ' '.join(p.extract_text() or '' for p in leitor.pages)
              print(f'{nome}: {len(leitor.pages)} páginas')
              if len(leitor.pages) != paginas:
                  erros.append(f'{nome}: {len(leitor.pages)} páginas, esperado {paginas}')
              if 'TERMO DE RESPONSABILIDADE' not in texto:
                  erros.append(f'{nome}: modelo oficial não encontrado')
          texto31 = ' '.join(p.extract_text() or '' for p in PdfReader(os.path.join(pasta, 'final-formulario-31.pdf')).pages)
          for trecho in ('Vasconcelos', 'Participante Grande 30'):
              if trecho not in texto31:
                  erros.append(f'participante ausente no PDF de 31: {trecho}')
          for e in erros:
              print(f'::error title=PDF oficial::{e}')
          sys.exit(1 if erros else 0)
          PY
          dump=$(pg_dump -h localhost -U courttime_e2e -d courttime_e2e --data-only)
          for cpf in '123.456.789-09' '12345678909' '529.982.247-25' '52998224725'; do
            if grep -qF "$cpf" <<<"$dump"; then
              echo "::error title=CPF::CPF encontrado no banco ($cpf)"
              exit 1
            fi
          done
          echo "::notice title=CPF::Nenhum CPF gravado no banco"

      - name: Resumo legível pela API (anotações)
        if: always()
        run: |
          node - <<'JS'
          const fs = require('fs');
          const dir = process.env.COURTTIME_E2E_EVIDENCE_DIR;
          const ler = f => { try { return JSON.parse(fs.readFileSync(`${dir}/${f}`, 'utf8')); } catch { return null; } };
          const jornada = ler('resultados-e2e.json') || ler('resultados-e2e-parcial.json');
          if (jornada) {
            const r = jornada.results || [];
            const falhas = r.filter(x => x.status === 'FAIL');
            console.log(`::notice title=Jornada::${r.length - falhas.length} aprovadas | ${falhas.length} reprovadas${jornada.error ? ' | interrompida' : ''}`);
            falhas.slice(0, 20).forEach(f => console.log(`::error title=Jornada::${f.name} ${f.detail || ''}`.slice(0, 900)));
            if (jornada.error) console.log(`::error title=Jornada interrompida::${String(jornada.error).split('\n')[0].slice(0, 900)}`);
          }
          const finalizacao = ler('resultados-finalizacao.json');
          if (finalizacao) {
            const r = finalizacao.results || [];
            const falhas = r.filter(x => x.status === 'FAIL');
            console.log(`::notice title=Finalização::${r.length - falhas.length} aprovadas | ${falhas.length} reprovadas`);
            falhas.slice(0, 20).forEach(f => console.log(`::error title=Finalização::${f.name} ${f.detail || ''}`.slice(0, 900)));
          }
          const axe = ler('resultados-axe.json');
          if (axe) {
            const v = axe.scans.flatMap(s => s.violations.map(x => ({ ...x, pagina: s.name, largura: s.viewport.width })));
            console.log(`::notice title=axe-core::${axe.scans.length} varreduras | ${v.length} violações`);
            v.slice(0, 20).forEach(x => console.log(`::warning title=axe ${x.impact}::${x.pagina} ${x.largura}px ${x.id}: ${x.help} — ${JSON.stringify(x.nodes).slice(0, 300)}`));
          }
          JS

      - name: Publicar evidências
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evidencias-ui-${{ github.sha }}
          path: evidencias-ui
          retention-days: 14

  # Copia as capturas (JPEG gerado pelo Playwright, dados sintéticos) para a branch
  # evidencias/ui-v2, para que revisores vejam as telas reais sem baixar
  # artefatos. Não altera código nem outras branches.
  publicar-capturas:
    needs: navegador
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: evidencias-ui-v2
      cancel-in-progress: false
    steps:
      - name: Baixar evidências
        uses: actions/download-artifact@v8
        with:
          name: evidencias-ui-${{ github.sha }}
          path: evidencias
      - name: Publicar na branch evidencias/ui-v2
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGEM: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          destino="$(echo "$ORIGEM" | tr '/' '_')/${GITHUB_SHA::7}"
          git init -q repo && cd repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin evidencias/ui-v2; then git checkout -q -b evidencias/ui-v2 FETCH_HEAD; else git checkout -q --orphan evidencias/ui-v2; fi
          rm -rf "$destino" && mkdir -p "$destino"
          cp ../evidencias/*.json "$destino"/ 2>/dev/null || true
          if [ -d ../evidencias/telas ]; then
            cp ../evidencias/telas/*.jpg "$destino"/ 2>/dev/null || true
          fi
          # Capturas tiradas durante a jornada, em estados que deixam de existir
          # no fim dela (fila da secretaria com formulários, reserva ainda
          # autorizada na segurança). Recebem o prefixo "jornada-".
          for arquivo in ../evidencias/secretaria-*.png ../evidencias/seguranca-*.png; do
            if [ -f "$arquivo" ]; then cp "$arquivo" "$destino/jornada-$(basename "$arquivo")"; fi
          done
          {
            echo "# Evidências de interface — $ORIGEM"
            echo
            echo "Capturas da aplicação real (dados sintéticos, banco descartável courttime_e2e)."
            echo "Commit: $GITHUB_SHA"
          } > "$destino/LEIA-ME.md"
          git add -A
          git commit -q -m "evidências: $ORIGEM ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            if git push -q origin HEAD:evidencias/ui-v2; then exit 0; fi
            git fetch -q --depth 1 origin evidencias/ui-v2 && git rebase -q FETCH_HEAD || true
          done
          exit 1
